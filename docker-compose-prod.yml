services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: test-app-prod
    container_name: test-app-prod
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./.env:/var/www/.env
    environment:
      - CI_ENVIRONMENT=production
      - APP_ENV=production
    depends_on:
      - redis
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: test-nginx-prod
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  
      - ./codeigniter:/var/www/html
      - ./logs-prod/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - app-network      

  db:
    image: mysql:8.0
    container_name: test_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      
  redis:
    image: redis:latest
    container_name: test-redis-prod
    ports:
      - "6379:6379"
    networks:
      - app-network  
    volumes:
      - ./data-prod/redis:/data 
      - ./redis.conf:/usr/local/etc/redis/redis.conf  
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local