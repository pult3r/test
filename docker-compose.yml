version: '3.8'

services:
  app:
    image: php:8.2-apache
    build:
      context: .  # Kontekst budowania (katalog, w którym znajduje się Dockerfile)
      dockerfile: Dockerfile  # Nazwa pliku Dockerfile (domyślnie "Dockerfile")
    container_name: test_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - /var/www/html/test:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      - db
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    command: ["bash", "-c", "docker-php-ext-install pdo pdo_mysql && apache2-foreground"]

  db:
    image: mysql:8.0
    container_name: test_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:





